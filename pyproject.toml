[project]
name = "demo-deal-platform"
version = "0.1.0"
description = "Demo PE deal intelligence platform: MCP server + ingestion pipeline."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "anthropic>=0.40",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
demo-deal-mcp = "demo_deal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "mcp_server/src/demo_deal_mcp",
    "services",
    "prompts",
]
